name: osv-scanner

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'   # weekly, catches newly published advisories

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      # --no-resolve: transitive resolution chokes on old boto3 metadata
      scan-args: |-
        -r
        --no-resolve
        ./
